<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CinePick AI</title>
    
    <!-- PWA / Mobile Capable Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#141414">
    <meta name="application-name" content="CinePick">
    
    <!-- Dynamic Manifest for PWA Installation -->
    <link rel="manifest" id="manifest-placeholder">

    <!-- Icons -->
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/2503/2503508.png">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2503/2503508.png">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            background-color: #141414;
            font-family: 'Roboto', sans-serif;
            color: #fff;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: none; 
        }
        
        h1, h2, .brand-font {
            font-family: 'Bebas Neue', cursive;
            letter-spacing: 1px;
        }

        .btn-netflix {
            background-color: #e50914;
            color: white;
            transition: all 0.2s ease;
        }
        .btn-netflix:hover {
            background-color: #b20710;
        }
        
        /* Nav Arrows - STRICTLY PC ONLY */
        .nav-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0,0,0,0.5);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            z-index: 50;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .nav-arrow:hover {
            background: rgba(229, 9, 20, 0.8);
            transform: translateY(-50%) scale(1.1);
        }
        .nav-arrow:active {
            transform: translateY(-50%) scale(0.95);
        }
        .nav-arrow.disabled {
            opacity: 0;
            pointer-events: none;
        }

        /* Animations */
        .slide-in-right { animation: slideInRight 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .slide-in-left { animation: slideInLeft 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        
        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(50px); }
            to { opacity: 1; transform: translateX(0); }
        }
        @keyframes slideInLeft {
            from { opacity: 0; transform: translateX(-50px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .genre-card {
            transition: transform 0.3s ease, opacity 0.3s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        .genre-card:hover {
            transform: scale(1.03);
            z-index: 10;
            border: 2px solid #e50914;
        }
        
        .loader {
            border: 4px solid #333;
            border-top: 4px solid #e50914;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* AI Gradient Text */
        .text-gradient-ai {
            background: linear-gradient(to right, #4facfe 0%, #00f2fe 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        /* Wishlist Heart Animation */
        .heart-active {
            color: #e50914 !important;
            animation: heartBeat 0.3s forwards;
        }
        @keyframes heartBeat {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }

        /* Confetti Canvas */
        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Canvas for Confetti -->
    <canvas id="confetti-canvas"></canvas>

    <!-- Navbar -->
    <nav class="flex items-center justify-between px-4 py-4 md:px-8 fixed w-full z-50 bg-gradient-to-b from-black/90 to-transparent pointer-events-none">
        <div class="pointer-events-auto text-4xl text-[#e50914] brand-font cursor-pointer hover:text-white transition drop-shadow-md" onclick="resetApp()">CINEPICK <span class="text-xs text-blue-400 font-sans tracking-widest ml-1 border border-blue-400 rounded px-1">AI</span></div>
        <div class="flex items-center gap-3 pointer-events-auto">
            <button id="install-btn" onclick="handleInstallClick()" class="hidden text-white bg-[#e50914] hover:bg-[#b20710] px-4 py-2 rounded-full text-sm font-bold shadow-lg transition animate-pulse">
                <i class="fas fa-download mr-2"></i> Install
            </button>
            <button onclick="toggleWatchlist()" class="relative text-gray-300 hover:text-white transition bg-white/10 p-2 md:px-4 md:py-2 rounded-full backdrop-blur-sm border border-white/10">
                <i class="fas fa-heart text-[#e50914]"></i> 
                <span class="hidden md:inline ml-2 text-sm font-bold">Watchlist</span>
                <span id="watchlist-count" class="absolute -top-1 -right-1 bg-[#e50914] text-white text-[10px] w-4 h-4 rounded-full flex items-center justify-center font-bold hidden">0</span>
            </button>
        </div>
    </nav>

    <!-- Main Content Area -->
    <div id="app-container" class="flex-grow flex items-center justify-center p-4 pt-20 overflow-hidden relative">
        
        <!-- View 1: Genre Selection -->
        <div id="genre-view" class="w-full max-w-6xl animate-fade-in pb-10">
            <h2 class="text-3xl md:text-5xl text-center mb-8 md:mb-12 font-bold text-white drop-shadow-lg leading-tight">
                What's the vibe tonight?
            </h2>
            
            <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3 md:gap-6" id="genre-grid">
                <!-- Genre Cards Injected Here -->
            </div>
        </div>

        <!-- View 2: Loading -->
        <div id="loading-view" class="hidden flex flex-col items-center justify-center text-center">
            <div class="loader mb-6"></div>
            <p id="loading-text" class="text-xl font-light tracking-wider animate-pulse text-gray-400">Curating experience...</p>
        </div>

        <!-- View 3: Movie Slider Result -->
        <div id="result-view" class="hidden w-full max-w-5xl mb-10 md:mb-0 relative min-h-[500px] flex items-center justify-center">
            
            <!-- Left Arrow (STRICTLY PC ONLY: hidden on mobile/tablet, flex on lg screens) -->
            <button id="nav-prev" onclick="prevMovie()" class="nav-arrow left-0 lg:-left-16 text-white text-2xl hidden lg:flex">
                <i class="fas fa-chevron-left"></i>
            </button>

            <!-- Card Container -->
            <div id="card-container" class="bg-[#181818] w-full rounded-2xl shadow-2xl overflow-hidden flex flex-col md:flex-row border border-[#333] relative z-10">
                <!-- Movie content injected via JS -->
            </div>

            <!-- Right Arrow (STRICTLY PC ONLY: hidden on mobile/tablet, flex on lg screens) -->
            <button id="nav-next" onclick="nextMovie()" class="nav-arrow right-0 lg:-right-16 text-white text-2xl hidden lg:flex">
                <i class="fas fa-chevron-right"></i>
            </button>
            
            <!-- Mobile Hints -->
            <div class="absolute bottom-[-30px] w-full text-center text-xs text-gray-500 lg:hidden animate-pulse">
                Swipe left or right to browse
            </div>
        </div>
        
        <!-- Watchlist View -->
        <div id="watchlist-view" class="hidden w-full max-w-4xl animate-fade-in pb-20">
            <div class="flex items-center justify-between mb-8">
                <h2 class="text-3xl font-bold">Your Watchlist</h2>
                <button onclick="closeWatchlist()" class="text-sm bg-white/10 px-4 py-2 rounded-full hover:bg-white/20">Back</button>
            </div>
            <div id="watchlist-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Watchlist items -->
            </div>
            <div id="empty-watchlist" class="hidden text-center py-20 text-gray-500">
                <i class="far fa-heart text-6xl mb-4 opacity-50"></i>
                <p>No movies saved yet. Swipe to explore!</p>
            </div>
        </div>

        <!-- AI Prompt Modal -->
        <div id="ai-modal" class="hidden fixed inset-0 bg-black/90 z-[60] flex items-center justify-center p-4 animate-fade-in">
            <div class="bg-[#1f1f1f] w-full max-w-lg rounded-2xl p-6 border border-blue-500/30 shadow-2xl relative">
                <button onclick="closeAiModal()" class="absolute top-4 right-4 text-gray-400 hover:text-white">
                    <i class="fas fa-times text-xl"></i>
                </button>
                
                <h3 class="text-2xl font-bold mb-2 flex items-center text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-500">
                    <i class="fas fa-magic mr-2 text-blue-400"></i> Magic Mood Picker
                </h3>
                <p class="text-gray-400 text-sm mb-6">Describe exactly what you want to watch. Be specific!</p>
                
                <textarea id="ai-input" rows="3" class="w-full bg-black/50 border border-gray-700 rounded-xl p-4 text-white focus:outline-none focus:border-blue-500 transition mb-4" placeholder="e.g. 'A mind-bending sci-fi thriller from the 2010s with a plot twist'"></textarea>
                
                <button onclick="runAiSearch()" class="w-full py-3 bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-700 hover:to-purple-700 rounded-xl font-bold text-white transition shadow-lg">
                    Find My Movie ✨
                </button>
            </div>
        </div>
    </div>

    <!-- Install Instructions Modal (iOS fallback) -->
    <div id="install-modal" class="hidden fixed inset-0 bg-black/90 z-[100] flex items-end md:items-center justify-center p-4 animate-fade-in">
        <div class="bg-[#222] w-full max-w-md rounded-2xl p-6 border border-gray-700 shadow-2xl relative">
            <button onclick="closeInstallHelp()" class="absolute top-4 right-4 text-gray-400 hover:text-white">
                <i class="fas fa-times text-xl"></i>
            </button>
            
            <h3 class="text-2xl font-bold mb-4 flex items-center">
                <i class="fas fa-mobile-alt mr-3 text-[#e50914]"></i> Install App
            </h3>
            <div class="space-y-6 text-gray-300">
                <div class="flex items-start gap-4">
                    <div class="bg-[#333] p-3 rounded-full h-10 w-10 flex items-center justify-center text-xl shrink-0"><i class="fab fa-apple"></i></div>
                    <div>
                        <p class="font-bold text-white mb-1">iOS (Safari)</p>
                        <p class="text-sm">Tap <span class="text-blue-400 font-bold"><i class="fas fa-share-square"></i> Share</span>, then <span class="font-bold text-white bg-gray-700 px-2 py-0.5 rounded text-xs">Add to Home Screen</span>.</p>
                    </div>
                </div>
            </div>
            <button onclick="closeInstallHelp()" class="w-full mt-6 py-3 bg-[#e50914] hover:bg-[#b20710] rounded-xl font-bold text-white transition">Close</button>
        </div>
    </div>

    <script>
        // --- GEMINI API CONFIGURATION ---
        const apiKey = ""; // Provided by runtime environment
        const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;

        // --- PWA Logic ---
        const manifest = {
            "name": "CinePick AI", "short_name": "CinePick", "start_url": ".", "display": "standalone",
            "background_color": "#141414", "theme_color": "#141414", "orientation": "portrait",
            "icons": [{ "src": "https://cdn-icons-png.flaticon.com/512/2503/2503508.png", "sizes": "512x512", "type": "image/png" }]
        };
        document.querySelector('#manifest-placeholder').setAttribute('href', URL.createObjectURL(new Blob([JSON.stringify(manifest)], {type: 'application/json'})));

        if ('serviceWorker' in navigator) {
            const swContent = "self.addEventListener('install', (e) => console.log('SW Install')); self.addEventListener('fetch', (e) => {});";
            // Added .catch() to handle unsupported blob URL schemes in service worker registration
            navigator.serviceWorker.register(URL.createObjectURL(new Blob([swContent], {type: 'text/javascript'})))
                .catch(err => console.log('Service Worker registration failed (likely due to preview environment restrictions):', err));
        }

        let deferredPrompt;
        const installBtn = document.getElementById('install-btn');
        window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredPrompt = e; installBtn.classList.remove('hidden'); });
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
        const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
        if (!isStandalone && isIOS) installBtn.classList.remove('hidden');

        function handleInstallClick() {
            if (deferredPrompt) { deferredPrompt.prompt(); deferredPrompt.userChoice.then(r => { if(r.outcome==='accepted') installBtn.classList.add('hidden'); deferredPrompt=null; }); }
            else if (isIOS) document.getElementById('install-modal').classList.remove('hidden');
        }
        function closeInstallHelp() { document.getElementById('install-modal').classList.add('hidden'); }

        // --- CONFETTI EFFECT ---
        function triggerConfetti() {
            const canvas = document.getElementById('confetti-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            const particles = [];
            const colors = ['#e50914', '#ffffff', '#ffd700', '#4facfe'];
            
            for (let i = 0; i < 100; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height - canvas.height,
                    r: Math.random() * 6 + 2,
                    d: Math.random() * 10 + 10,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    tilt: Math.floor(Math.random() * 10) - 10,
                    tiltAngle: 0,
                    tiltAngleIncr: Math.random() * 0.07 + 0.05
                });
            }

            let angle = 0;
            function draw() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                angle += 0.01;
                for (let i = 0; i < particles.length; i++) {
                    let p = particles[i];
                    ctx.beginPath();
                    ctx.lineWidth = p.r / 2;
                    ctx.strokeStyle = p.color;
                    ctx.moveTo(p.x + p.tilt + p.r / 4, p.y);
                    ctx.lineTo(p.x + p.tilt, p.y + p.tilt + p.r / 4);
                    ctx.stroke();
                    
                    p.y += Math.cos(angle + p.d) + 1 + p.r / 2;
                    p.x += Math.sin(angle);
                    p.tilt = Math.sin(p.tiltAngle - i / 3) * 15;
                    p.tiltAngle += p.tiltAngleIncr;
                    
                    if (p.y > canvas.height) particles.splice(i, 1);
                }
                if (particles.length > 0) requestAnimationFrame(draw);
                else ctx.clearRect(0,0,canvas.width,canvas.height);
            }
            draw();
        }

        // --- AI HELPERS ---
        async function callGemini(prompt) {
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }]
                    })
                });
                const data = await response.json();
                return data.candidates?.[0]?.content?.parts?.[0]?.text || null;
            } catch (e) {
                console.error("Gemini Error:", e);
                return null;
            }
        }

        async function getAiRecommendation(userQuery) {
            const prompt = `
                You are a movie recommendation engine. Based on this request: "${userQuery}", recommend ONE single movie.
                Return ONLY a JSON object (no markdown, no extra text) with this specific schema:
                {
                    "t": "Title",
                    "y": "Year (number)",
                    "r": "IMDb Rating (string, e.g. '8.5')",
                    "d": "Short engaging plot summary (max 2 sentences)",
                    "ol": "Original Language (e.g. 'English', 'Telugu')",
                    "al": "Audio Languages Available (short string)",
                    "g": "Genre"
                }
                If the request is nonsense, pick a popular movie like 'Inception'.
            `;
            const jsonText = await callGemini(prompt);
            if (!jsonText) return null;
            
            try {
                // Clean markdown if present
                const cleaned = jsonText.replace(/```json/g, '').replace(/```/g, '').trim();
                const movie = JSON.parse(cleaned);
                // Process into app format
                return {
                    title: movie.t,
                    year: movie.y,
                    rating: movie.r,
                    desc: movie.d,
                    orgLang: movie.ol || "Unknown",
                    audio: movie.al || "Unknown",
                    genre: movie.g || "AI Pick",
                    runtime: "AI Choice",
                    poster: getPoster(movie.t, movie.y),
                    link: getLink(movie.t),
                    platformName: "Find Stream",
                    isAi: true
                };
            } catch (e) {
                console.error("Parse Error:", e);
                return null;
            }
        }

        async function getAiHype(title) {
            const prompt = `Give me a one-sentence, high-energy hype pitch for why I MUST watch the movie "${title}" right now. Use an emoji.`;
            const text = await callGemini(prompt);
            return text || "This movie is an absolute masterpiece you can't miss! 🍿";
        }

        async function getAiTrivia(title) {
            const prompt = `Tell me one specific, fascinating, and lesser-known trivia fact about the production or cast of the movie "${title}". Keep it under 30 words and be engaging.`;
            const text = await callGemini(prompt);
            return text || "Did you know? This movie is considered a classic in its genre!";
        }

        async function triggerAiContent(type, title) {
            const box = document.getElementById('ai-hype-box');
            box.innerHTML = '<i class="fas fa-circle-notch fa-spin mr-2"></i> Asking AI...';
            box.classList.remove('hidden');
            
            let content = "";
            if (type === 'hype') {
                content = await getAiHype(title);
            } else {
                content = await getAiTrivia(title);
            }
            
            const icon = type === 'hype' ? '🔥' : '💡';
            const label = type === 'hype' ? 'Hype' : 'Fact';
            box.innerHTML = `<span class="text-lg mr-2">${icon}</span> <span class="font-bold text-xs uppercase opacity-70 mr-1">${label}:</span> ${content} <span class="block text-right text-[10px] mt-1 opacity-50">- Gemini AI</span>`;
        }

        // --- HELPER FUNCTIONS ---
        function getStarRating(ratingStr) {
            const rating = parseFloat(ratingStr);
            if (isNaN(rating)) return '';
            
            const stars = Math.round(rating / 2); // Convert 10-scale to 5-scale
            let html = '';
            for (let i = 0; i < 5; i++) {
                if (i < stars) {
                    html += '<i class="fas fa-star text-yellow-500 text-xs"></i>';
                } else {
                    html += '<i class="far fa-star text-gray-600 text-xs"></i>';
                }
            }
            return `<span class="flex gap-0.5 ml-1">${html}</span>`;
        }

        function shareMovie(title, text, url) {
            if (navigator.share) {
                navigator.share({
                    title: `CinePick: ${title}`,
                    text: `${text}\n\nCheck it out here:`,
                    url: url || window.location.href
                }).catch(err => console.log('Error sharing', err));
            } else {
                // Fallback
                const tempInput = document.createElement('input');
                document.body.appendChild(tempInput);
                tempInput.value = `${title} - ${text} (Search on Google)`;
                tempInput.select();
                document.execCommand('copy');
                document.body.removeChild(tempInput);
                alert('Movie details copied to clipboard!');
            }
        }

        // --- APP DATA & LOGIC ---
        const getPoster = (title, year) => `https://placehold.co/600x900/0f0f0f/e50914?text=${encodeURIComponent(title)}+%0A(${year})&font=oswald`;
        const getLink = (title) => `https://www.justwatch.com/in/search?q=${encodeURIComponent(title)}`;
        const getYoutube = (title) => `https://www.youtube.com/results?search_query=${encodeURIComponent(title + " full movie")}`;

        const rawMovies = {
            'Action': [
                { t: "RRR", y: 2022, r: "8.8", ol: "Telugu", al: "Tel, Hin, Tam, Eng", d: "A fearless warrior on a perilous mission comes face to face with a steely cop serving the British forces in this epic saga.", yt: false },
                { t: "K.G.F: Chapter 2", y: 2022, r: "8.3", ol: "Kannada", al: "Kan, Tel, Hin", d: "In the blood-soaked Kolar Gold Fields, Rocky's name strikes fear into his foes. His allies look up to him as their Savior.", yt: false },
                { t: "Salaar", y: 2023, r: "7.1", ol: "Telugu", al: "Tel, Hin, Tam", d: "A gang leader makes a promise to a dying friend and takes on other criminal gangs.", yt: false },
                { t: "Vikram", y: 2022, r: "8.3", ol: "Tamil", al: "Tam, Tel, Hin", d: "A special investigator discovers a case of serial killings is not what it seems to be.", yt: false },
                { t: "John Wick 4", y: 2023, r: "7.7", ol: "English", al: "Eng, Hin, Tel", d: "John Wick uncovers a path to defeating The High Table.", yt: false },
                { t: "Mad Max: Fury Road", y: 2015, r: "8.1", ol: "English", al: "Eng, Hin", d: "A woman rebels against a tyrannical ruler in post-apocalyptic Australia.", yt: false },
                { t: "Gladiator", y: 2000, r: "8.5", ol: "English", al: "Eng, Hin", d: "A former Roman General sets out to exact vengeance against the corrupt emperor.", yt: false },
                { t: "Baahubali 2", y: 2017, r: "8.2", ol: "Telugu", al: "Tel, Tam, Hin", d: "When Shiva, the son of Bahubali, learns about his heritage, he begins to look for answers.", yt: false },
                { t: "Pushpa: The Rise", y: 2021, r: "7.6", ol: "Telugu", al: "Tel, Hin, Tam", d: "A labourer rises through the ranks of a red sandal smuggling syndicate.", yt: false },
                { t: "Kaithi", y: 2019, r: "8.5", ol: "Tamil", al: "Tam, Tel, Hin", d: "A recently released prisoner is forced to drive a truck laden with poisoned cops to a hospital while evading criminals.", yt: false },
                { t: "Thuppakki", y: 2012, r: "8.1", ol: "Tamil", al: "Tam, Tel, Hin", d: "An army captain is on a mission to track down and destroy a terrorist gang and deactivate the sleeper cells under its command.", yt: false },
                { t: "Dhruva", y: 2016, r: "8.0", ol: "Telugu", al: "Tel, Hin", d: "A committed police officer sets out to destroy the most corrupt person in the country, Siddharth Abhimanyu.", yt: false },
                { t: "The Dark Knight Rises", y: 2012, r: "8.4", ol: "English", al: "Eng, Hin, Tel, Tam", d: "Eight years after the Joker's reign of anarchy, Batman is forced out of exile by the brutal guerrilla terrorist Bane.", yt: false },
                { t: "Avengers: Infinity War", y: 2018, r: "8.4", ol: "English", al: "Eng, Hin, Tel, Tam", d: "The Avengers and their allies must be willing to sacrifice all in an attempt to defeat the powerful Thanos.", yt: false },

                { t: "Mayabazar", y: 1957, r: "9.1", ol: "Telugu", al: "Tel, Tam", d: "The Pandavas' cousin, Lord Krishna, helps them win the heart of Balarama's daughter, Sasirekha, who is betrothed to Duryodhana's son, Lakshmana.", yt: true },
                { t: "Sankarabharanam", y: 1980, r: "9.0", ol: "Telugu", al: "Tel, Tam, Hin", d: "A renowned classical singer finds himself in a dilemma when his daughter falls in love with a western music teacher.", yt: true },
                { t: "Sagara Sangamam", y: 1983, r: "8.8", ol: "Telugu", al: "Tel, Tam, Mal", d: "A talented classical dancer, Balu, is unable to find recognition. However, he finds hope when a woman enters his life and encourages him.", yt: true },
                { t: "Swathi Muthyam", y: 1986, r: "8.7", ol: "Telugu", al: "Tel, Tam", d: "A young widow is rescued by an innocent man, who marries her and faces the wrath of the village.", yt: true },
                { t: "Siva", y: 1989, r: "8.7", ol: "Telugu", al: "Tel, Hin", d: "Siva, a college student, takes on the local mafia when he witnesses their atrocities in his college.", yt: true },
                { t: "Kshana Kshanam", y: 1991, r: "8.3", ol: "Telugu", al: "Tel, Hin", d: "A middle-class girl and a petty thief get entangled in a bank robbery and are chased by the robbers and the police.", yt: true },
                { t: "Annamayya", y: 1997, r: "8.6", ol: "Telugu", al: "Tel, Tam", d: "The life story of the 15th-century saint poet Annamacharya, who dedicated his life to Lord Venkateswara.", yt: true },
                { t: "Bommarillu", y: 2006, r: "8.2", ol: "Telugu", al: "Tel, Tam", d: "A young man who has always been micromanaged by his overbearing father falls in love with a girl who teaches him to stand up for himself.", yt: false },
                { t: "Nuvvostanante Nenoddantana", y: 2005, r: "8.0", ol: "Telugu", al: "Tel, Tam, Hin", d: "A rich city boy falls in love with a village girl, but her brother challenges him to prove his worth by working in the fields.", yt: false },
                { t: "Vedam", y: 2010, r: "8.1", ol: "Telugu", al: "Tel", d: "Five people from different walks of life get entangled in a terrorist attack in a hospital.", yt: false },
                { t: "Prasthanam", y: 2010, r: "8.3", ol: "Telugu", al: "Tel, Hin", d: "A politician's stepson is a man of principles, while his biological son is corrupt. The father must choose between his legacy and his blood.", yt: false },
                { t: "Gamyam", y: 2008, r: "8.0", ol: "Telugu", al: "Tel, Tam, Kan", d: "Two men, one a thief and the other a rich guy, meet on a journey and learn about life from each other.", yt: false },
                { t: "Ye Maaya Chesave", y: 2010, r: "7.7", ol: "Telugu", al: "Tel, Tam, Hin", d: "A mechanical engineering student falls in love with his neighbor, but their different religions and age gap cause conflicts.", yt: false },
                { t: "Leader", y: 2010, r: "7.9", ol: "Telugu", al: "Tel, Tam", d: "A young man enters politics to fulfill his father's dream of a corruption-free society.", yt: false },
                { t: "Arjun Reddy", y: 2017, r: "7.9", ol: "Telugu", al: "Tel", d: "A brilliant but short-tempered surgeon spirals into self-destruction when his girlfriend is forced to marry another man.", yt: false },
                { t: "Major", y: 2022, r: "8.1", ol: "Telugu", al: "Tel, Hin, Mal", d: "Based on the life of Major Sandeep Unnikrishnan, who was martyred during the 2008 Mumbai attacks.", yt: false },
                { t: "Hi Nanna", y: 2023, r: "8.2", ol: "Telugu", al: "Tel, Hin, Tam, Mal, Kan", d: "A single father's life takes a turn when his daughter befriends a woman who has a mysterious connection to their past.", yt: false },
                { t: "Ante Sundaraniki", y: 2022, r: "7.6", ol: "Telugu", al: "Tel, Mal, Tam", d: "A Hindu Brahmin man falls in love with a Christian woman and they spin a web of lies to convince their parents.", yt: false },
                { t: "Balagam", y: 2023, r: "8.1", ol: "Telugu", al: "Tel", d: "In a village in Telangana, a family feud erupts after the death of the patriarch, testing their bonds and traditions.", yt: false },
                { t: "Dasara", y: 2023, r: "6.7", ol: "Telugu", al: "Tel, Hin, Tam, Kan, Mal", d: "In a village in Singareni Coal Mines, a young man rises to become a leader and fights against the oppression of the upper caste.", yt: false },
                { t: "Baby", y: 2023, r: "7.3", ol: "Telugu", al: "Tel", d: "A profound love story between two neighbors that takes an unexpected turn as they grow up.", yt: false },
                { t: "Miss Shetty Mr Polishetty", y: 2023, r: "7.0", ol: "Telugu", al: "Tel, Tam, Kan, Mal", d: "A chef from London and a stand-up comedian from Hyderabad navigate their relationship and their different perspectives on life.", yt: false },
                { t: "Month of Madhu", y: 2023, r: "7.1", ol: "Telugu", al: "Tel", d: "A poignant exploration of relationships, love, and self-discovery.", yt: false },
                { t: "Mangalavaaram", y: 2023, r: "6.3", ol: "Telugu", al: "Tel, Tam, Kan, Mal", d: "A village is gripped by fear as mysterious deaths occur every Tuesday.", yt: false },
                { t: "HanuMan", y: 2024, r: "7.9", ol: "Telugu", al: "Tel, Hin, Tam, Kan, Mal", d: "An ordinary man gains superpowers from Lord Hanuman and must protect his village from a power-hungry villain.", yt: false },
                { t: "Gaami", y: 2024, r: "7.2", ol: "Telugu", al: "Tel, Hin, Tam, Kan", d: "An aghora embarks on a perilous journey to the Himalayas to find a cure for his rare condition.", yt: false }
            ]
        };

        // --- Prepare Data Logic ---
        const movies = {};
        let allMovies = [];
        for (const [genre, list] of Object.entries(rawMovies)) {
            const processed = list.map(m => ({
                title: m.t, year: m.y, rating: m.r, desc: m.d,
                orgLang: m.ol || "English", audio: m.al || "English",
                runtime: "120m", poster: getPoster(m.t, m.y),
                link: m.yt ? getYoutube(m.t) : getLink(m.t),
                platformName: m.yt ? "YouTube" : "Find Stream"
            }));
            movies[genre] = processed;
            allMovies = [...allMovies, ...processed];
        }

        // State
        let currentGenre = '';
        let currentMovie = null;
        let seenMovies = new Set();
        let watchlist = JSON.parse(localStorage.getItem('cinepick_watchlist') || '[]');
        let history = []; 
        let currentIndex = -1;

        // Render Genre Grid
        const genreGrid = document.getElementById('genre-grid');
        Object.keys(movies).forEach(genre => {
            const card = document.createElement('div');
            card.className = 'genre-card h-28 md:h-40 rounded-xl relative flex items-center justify-center bg-zinc-800 border border-zinc-700';
            card.innerHTML = `<div class="absolute inset-0 bg-black/30"></div><h3 class="text-xl md:text-2xl font-bold uppercase tracking-wider z-10 text-white drop-shadow-lg">${genre}</h3>`;
            card.onclick = () => startSelection(genre);
            genreGrid.appendChild(card);
        });

        // AI Pick Card
        const aiCard = document.createElement('div');
        aiCard.className = 'genre-card h-28 md:h-40 rounded-xl relative flex items-center justify-center border border-blue-500/50 col-span-2 md:col-span-1 bg-gradient-to-br from-gray-900 to-blue-900';
        aiCard.innerHTML = `<div class="absolute inset-0 bg-black/20"></div><h3 class="text-xl md:text-2xl font-bold uppercase tracking-wider z-10 text-white drop-shadow-lg flex items-center text-center"><i class="fas fa-sparkles mr-2 text-blue-400"></i> AI Pick</h3>`;
        aiCard.onclick = openAiModal;
        genreGrid.prepend(aiCard); // Add to start

        // Add "Surprise Me" Card
        const surpriseCard = document.createElement('div');
        surpriseCard.className = 'genre-card h-28 md:h-40 rounded-xl relative flex items-center justify-center border border-zinc-700 col-span-2 md:col-span-1 bg-gradient-to-br from-gray-900 to-pink-900';
        surpriseCard.innerHTML = `<div class="absolute inset-0 bg-black/20"></div><h3 class="text-xl md:text-2xl font-bold uppercase tracking-wider z-10 text-white drop-shadow-lg flex items-center"><i class="fas fa-random mr-2 text-pink-400"></i> Random</h3>`;
        surpriseCard.onclick = () => startSelection('Surprise');
        genreGrid.appendChild(surpriseCard);

        // Navigation Logic
        function startSelection(genre) {
            currentGenre = genre;
            switchView('loading');
            seenMovies.clear(); history = []; currentIndex = -1;
            setTimeout(() => {
                switchView('result');
                nextMovie();
            }, 600);
        }

        function openAiModal() { document.getElementById('ai-modal').classList.remove('hidden'); }
        function closeAiModal() { document.getElementById('ai-modal').classList.add('hidden'); }

        async function runAiSearch() {
            const query = document.getElementById('ai-input').value;
            if(!query) return;
            closeAiModal();
            switchView('loading');
            document.getElementById('loading-text').innerText = "Asking Gemini AI...";
            
            // API Call
            const aiMovie = await getAiRecommendation(query);
            
            if(aiMovie) {
                currentGenre = "AI Pick ✨";
                seenMovies.clear(); history = []; currentIndex = -1;
                
                // Manually push to history and render
                history.push(aiMovie);
                currentIndex = 0;
                switchView('result');
                triggerConfetti(); // Celebrate AI Pick
                renderCard(aiMovie, 'right');
            } else {
                // Fallback
                startSelection('Surprise');
            }
        }

        function nextMovie() {
            if (currentIndex < history.length - 1) {
                currentIndex++;
                renderCard(history[currentIndex], 'right');
            } else {
                generateNewMovie();
            }
        }

        function prevMovie() {
            if (currentIndex > 0) {
                currentIndex--;
                renderCard(history[currentIndex], 'left');
            }
        }

        async function generateNewMovie() {
            if (currentGenre === "AI Pick ✨") {
                currentGenre = "Surprise"; 
            }

            let pool = currentGenre === 'Surprise' ? allMovies : movies[currentGenre];
            let available = pool.filter(m => !seenMovies.has(m.title));
            if (available.length === 0) { seenMovies.clear(); available = pool; }
            
            currentMovie = available[Math.floor(Math.random() * available.length)];
            seenMovies.add(currentMovie.title);
            history.push(currentMovie);
            currentIndex = history.length - 1;
            renderCard(currentMovie, 'right');
        }

        function renderCard(movie, direction) {
            // Handle Arrows
            const prevBtn = document.getElementById('nav-prev');
            if(prevBtn) prevBtn.classList.toggle('disabled', currentIndex === 0);

            const isSaved = watchlist.some(m => m.title === movie.title);
            const heartClass = isSaved ? "text-[#e50914]" : "text-white";
            const btnClass = movie.platformName === "YouTube" ? "bg-red-600" : "bg-[#e50914]";
            const iconClass = movie.platformName === "YouTube" ? "fab fa-youtube" : "fas fa-play";
            const starsHtml = getStarRating(movie.rating);

            const html = `
                <div class="w-full md:w-5/12 relative h-[50vh] md:h-auto bg-black shrink-0 group">
                    <img src="${movie.poster}" class="w-full h-full object-cover opacity-90 group-hover:opacity-100 transition duration-500 pointer-events-none">
                    <div class="absolute inset-0 bg-gradient-to-t from-[#181818] via-transparent to-transparent md:bg-gradient-to-r"></div>
                    <div class="absolute top-4 left-4 bg-black/60 backdrop-blur-md px-3 py-1 rounded-lg border border-white/10 shadow-lg">
                        <span class="text-[10px] text-gray-300 uppercase block">Language</span>
                        <div class="text-white font-bold text-sm">${movie.orgLang}</div>
                    </div>
                    <button onclick="toggleSaveCurrent()" class="md:hidden absolute top-4 right-4 bg-black/50 p-3 rounded-full backdrop-blur-sm border border-white/10 z-20 active:scale-90 transition"><i id="heart-mobile" class="fas fa-heart text-xl ${heartClass}"></i></button>
                </div>
                <div class="w-full md:w-7/12 p-6 md:p-10 flex flex-col justify-center relative bg-[#181818]">
                    <div class="hidden md:flex absolute top-6 right-6 gap-3 z-20">
                         <button onclick="shareMovie('${movie.title.replace(/'/g, "\\'")}', '${movie.desc.replace(/'/g, "\\'")}')" class="text-gray-400 hover:text-white transition bg-white/5 p-3 rounded-full hover:bg-white/10"><i class="fas fa-share-alt text-xl"></i></button>
                         <button onclick="toggleSaveCurrent()" class="text-gray-400 hover:text-[#e50914] transition bg-white/5 p-3 rounded-full hover:bg-white/10"><i id="heart-desktop" class="fas fa-heart text-xl ${heartClass}"></i></button>
                        <button onclick="resetApp()" class="text-gray-400 hover:text-white transition bg-white/5 p-3 rounded-full hover:bg-white/10"><i class="fas fa-times text-xl"></i></button>
                    </div>
                    <div class="mb-4">
                        <div class="flex items-center space-x-2 mb-2">
                             <span class="text-[10px] font-bold text-[#e50914] uppercase border border-[#e50914] px-2 py-0.5 rounded-sm">${movie.genre || currentGenre}</span>
                             <span class="text-green-400 text-xs font-bold"><i class="fas fa-check-circle mr-1"></i>Match</span>
                        </div>
                        <h1 class="text-3xl md:text-5xl font-bold leading-none mb-2 text-white">${movie.title}</h1>
                        <div class="flex flex-wrap items-center gap-3 text-sm text-gray-400 font-medium">
                            <span class="text-white bg-white/10 px-2 rounded">${movie.year}</span>
                            <span>${movie.rating}</span>
                            ${starsHtml}
                        </div>
                    </div>
                    <div class="relative">
                        <p class="text-gray-300 text-sm md:text-base leading-relaxed mb-4 line-clamp-4 border-l-2 border-[#e50914] pl-3">${movie.desc}</p>
                        <div id="ai-hype-box" class="hidden mb-4 p-3 bg-blue-900/20 border border-blue-500/30 rounded-lg text-blue-200 text-sm italic"></div>
                    </div>
                    
                    <div class="flex gap-3 mt-auto">
                        <a href="${movie.link}" target="_blank" class="flex-1 py-4 rounded-xl font-bold text-white text-lg flex items-center justify-center shadow-lg transition transform active:scale-95 ${btnClass}"><i class="${iconClass} mr-2"></i> Watch</a>
                        <button onclick="triggerAiContent('hype', '${movie.title.replace(/'/g, "\\'")}')" class="px-4 bg-gray-800 rounded-xl text-blue-400 border border-blue-500/30 hover:bg-gray-700 transition" title="AI Hype"><i class="fas fa-sparkles"></i></button>
                        <button onclick="triggerAiContent('trivia', '${movie.title.replace(/'/g, "\\'")}')" class="px-4 bg-gray-800 rounded-xl text-yellow-400 border border-yellow-500/30 hover:bg-gray-700 transition" title="AI Trivia"><i class="fas fa-lightbulb"></i></button>
                        <button onclick="shareMovie('${movie.title.replace(/'/g, "\\'")}', '${movie.desc.replace(/'/g, "\\'")}')" class="md:hidden px-4 bg-gray-800 rounded-xl text-gray-400 border border-gray-700 hover:bg-gray-700 transition"><i class="fas fa-share-alt"></i></button>
                    </div>
                </div>
            `;
            const container = document.getElementById('card-container');
            container.innerHTML = html;
            container.classList.remove('slide-in-right', 'slide-in-left');
            void container.offsetWidth;
            container.classList.add(direction === 'right' ? 'slide-in-right' : 'slide-in-left');
        }

        // --- Touch Logic ---
        let touchStartX = 0; let touchEndX = 0;
        const sliderArea = document.getElementById('result-view');
        sliderArea.addEventListener('touchstart', e => touchStartX = e.changedTouches[0].screenX, {passive: true});
        sliderArea.addEventListener('touchend', e => {
            touchEndX = e.changedTouches[0].screenX;
            if (touchEndX < touchStartX - 50) nextMovie();
            if (touchEndX > touchStartX + 50) prevMovie();
        }, {passive: true});

        // --- View Management ---
        function switchView(viewName) {
            document.getElementById('genre-view').classList.add('hidden');
            document.getElementById('loading-view').classList.add('hidden');
            document.getElementById('result-view').classList.add('hidden');
            document.getElementById('watchlist-view').classList.add('hidden');
            
            if(viewName === 'home') document.getElementById('genre-view').classList.remove('hidden');
            if(viewName === 'loading') document.getElementById('loading-view').classList.remove('hidden');
            if(viewName === 'result') document.getElementById('result-view').classList.remove('hidden');
            if(viewName === 'watchlist') document.getElementById('watchlist-view').classList.remove('hidden');
        }

        function resetApp() { switchView('home'); currentGenre = ''; }
        
        // Watchlist Functions (Condensed)
        function toggleWatchlist() { renderWatchlist(); switchView('watchlist'); }
        function closeWatchlist() { resetApp(); }
        function toggleSaveCurrent() {
            const movie = history[currentIndex];
            const idx = watchlist.findIndex(m => m.title === movie.title);
            if (idx > -1) watchlist.splice(idx, 1); else watchlist.push(movie);
            localStorage.setItem('cinepick_watchlist', JSON.stringify(watchlist));
            updateWatchlistCount(); renderCard(movie, 'none'); // Re-render to update heart
        }
        function updateWatchlistCount() {
            const el = document.getElementById('watchlist-count');
            el.innerText = watchlist.length;
            watchlist.length > 0 ? el.classList.remove('hidden') : el.classList.add('hidden');
        }
        function renderWatchlist() {
            const grid = document.getElementById('watchlist-grid');
            grid.innerHTML = '';
            document.getElementById('empty-watchlist').classList.toggle('hidden', watchlist.length > 0);
            watchlist.forEach(m => {
                grid.innerHTML += `<div class="bg-[#181818] rounded-xl p-4 flex gap-4 border border-[#333] relative"><img src="${m.poster}" class="w-16 h-24 object-cover rounded"><div class="flex-1"><h3 class="font-bold">${m.title}</h3><a href="${m.link}" target="_blank" class="text-xs bg-white/10 px-2 py-1 rounded">Watch</a></div></div>`;
            });
        }
        
        // Init
        updateWatchlistCount();
    </script>
</body>
</html>
